# Runs on every push and pull request: catches mistakes before they reach a build.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Build the server bundle
        run: npm run server:build

  server-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: |
          printf 'DOMAIN=api.example.in\n' > deploy/.env
          docker compose -f deploy/docker-compose.yml config -q
      - name: Server image builds
        run: docker build -t instaride-server .
