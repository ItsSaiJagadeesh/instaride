# One-click Android build. On GitHub: Actions tab, "Build Android app", "Run workflow".
#   demo  = the server-free demo (sign in with 9182631581 / 123456). Needs nothing else.
#   live  = the real app pointing at your server. Needs your server address.
# Signing: add the four ANDROID_* secrets once (see scripts/make-upload-key.sh) and every build is signed with YOUR key.
# Without them the build is signed with a throwaway key: fine for installing on phones, NOT for Google Play.
name: Build Android app

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "What to build"
        type: choice
        options: [demo, live]
        default: demo
      server_address:
        description: "Live only: your server address WITHOUT https:// (for example api.yourdomain.in)"
        type: string
        default: ""
      allow_http:
        description: "Live test build only: allow plain http (a server on your own Wi-Fi). Never for Google Play."
        type: boolean
        default: false
      play_bundle:
        description: "Also build the .aab file for Google Play (needs the signing secrets and a live https address)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check the choices
        env:
          KIND: ${{ inputs.kind }}
          SERVER_ADDRESS: ${{ inputs.server_address }}
          ALLOW_HTTP: ${{ inputs.allow_http }}
          PLAY_BUNDLE: ${{ inputs.play_bundle }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
          HAS_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY != '' }}
          HAS_MAPPLS: ${{ secrets.MAPPLS_ANDROID_CONFIG_ZIP_BASE64 != '' }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          if [ "$KIND" = "live" ]; then
            [ -n "$SERVER_ADDRESS" ] || fail "Live build: please fill in the server address (for example api.yourdomain.in)."
            [[ "$SERVER_ADDRESS" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]] || fail "The server address must be just a name like api.yourdomain.in, with no https:// and no slash."
            case "$SERVER_ADDRESS" in *REPLACE_WITH*) fail "That is still the placeholder. Use your real server address." ;; esac
          fi
          if [ "$PLAY_BUNDLE" = "true" ]; then
            [ "$KIND" = "live" ] || fail "The Google Play file must be a live build, not the demo."
            [ "$ALLOW_HTTP" != "true" ] || fail "A Google Play build must not allow plain http. Untick allow_http."
            [ "$HAS_KEY" = "true" ] || fail "The Google Play file must be signed with your own key. Add the four ANDROID_* secrets first (see scripts/make-upload-key.sh)."
            [ "$HAS_MAPPLS" = "true" ] || fail "The Google Play file needs the map to work. Add the MAPPLS_ANDROID_CONFIG_ZIP_BASE64 secret first (see GO_LIVE.md)."
            if [[ "$SERVER_ADDRESS" =~ ^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.) ]]; then fail "A Google Play build cannot point at a local address."; fi
          fi
          mapplsOn=false
          if [ "$HAS_MAPPLS" = "true" ]; then
            if [ "$HAS_KEY" = "true" ]; then
              mapplsOn=true
            else
              echo "::warning::The Mappls files are saved, but this build is signed with a throwaway key, which Mappls would reject. Using the placeholder map. Add the four ANDROID_* secrets to use Mappls."
            fi
          fi
          {
            echo "ANDROID_VERSION_CODE=${GITHUB_RUN_NUMBER}"
            if [ "$KIND" = "demo" ]; then
              echo "EXPO_PUBLIC_DEMO=1"
            else
              echo "EXPO_PUBLIC_DOMAIN=${SERVER_ADDRESS}"
              echo "EAS_BUILD=1"
              if [ "$PLAY_BUNDLE" = "true" ]; then echo "EAS_BUILD_PROFILE=app-production"; else echo "EAS_BUILD_PROFILE=app-preview"; fi
              if [ "$ALLOW_HTTP" = "true" ]; then echo "ALLOW_CLEARTEXT=1"; fi
              if [ "$HAS_MAPS_KEY" = "true" ] && [ "$mapplsOn" != "true" ]; then echo "EXPO_PUBLIC_MAPS=native"; fi
            fi
            if [ "$mapplsOn" = "true" ]; then
              echo "MAPPLS_ENABLED=1"
              echo "EXPO_PUBLIC_MAPS=mappls"
            fi
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Unpack the Mappls files
        if: env.MAPPLS_ENABLED == '1'
        env:
          MAPPLS_ZIP_B64: ${{ secrets.MAPPLS_ANDROID_CONFIG_ZIP_BASE64 }}
        run: |
          dir="$RUNNER_TEMP/mappls"
          mkdir -p "$dir"
          if ! printf '%s' "$MAPPLS_ZIP_B64" | base64 -d > "$RUNNER_TEMP/mappls.zip" 2>/dev/null; then
            echo "::error::MAPPLS_ANDROID_CONFIG_ZIP_BASE64 is not valid. Copy it again from the Mappls zip (see GO_LIVE.md)."
            exit 1
          fi
          if ! unzip -o -j -q "$RUNNER_TEMP/mappls.zip" '*.a.olf' '*.a.conf' -d "$dir"; then
            echo "::error::The Mappls zip must contain one .a.olf and one .a.conf file."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/mappls.zip"
          olf=$(find "$dir" -name '*.a.olf' | wc -l)
          conf=$(find "$dir" -name '*.a.conf' | wc -l)
          if [ "$olf" != "1" ] || [ "$conf" != "1" ]; then
            echo "::error::Expected exactly one .a.olf and one .a.conf file, found $olf and $conf."
            exit 1
          fi
          echo "MAPPLS_CONFIG_DIR=$dir" >> "$GITHUB_ENV"
          echo "Mappls files unpacked (their contents are never shown)."

      - name: Make the Android project
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build
        shell: bash
        env:
          PLAY_BUNDLE: ${{ inputs.play_bundle }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          cd android
          chmod +x gradlew
          tasks=(assembleRelease)
          # Test builds are 64-bit phones only (every modern phone), which roughly halves the build time.
          # The Google Play build also includes 32-bit phones.
          archs="arm64-v8a"
          if [ "$PLAY_BUNDLE" = "true" ]; then tasks+=(bundleRelease); archs="arm64-v8a,armeabi-v7a"; fi
          # Expo's default gives Gradle 2 GB, which React Native builds can run out of. GitHub's machines have plenty more.
          ./gradlew "${tasks[@]}" --no-daemon --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" \
            "-PreactNativeArchitectures=$archs" 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_BUNDLE: ${{ inputs.play_bundle }}
        run: |
          ks="$RUNNER_TEMP/upload.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            # Secrets pasted by hand often carry a stray space or line break. None of the real values contain any, so remove them.
            KEYSTORE_B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"
            KS_PASS="$(printf '%s' "$KS_PASS" | tr -d '[:space:]')"
            KEY_PASS="$(printf '%s' "$KEY_PASS" | tr -d '[:space:]')"
            KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')"
            if ! printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks" 2>/dev/null || [ ! -s "$ks" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not a valid key file (it has ${#KEYSTORE_B64} characters; a real one has about 3,500). Copy it again from github-secrets.txt and replace the secret."
              exit 1
            fi
            export KS_PASS KEY_PASS
            if ! keytool -list -keystore "$ks" -storepass:env KS_PASS > "$RUNNER_TEMP/kt.out" 2> "$RUNNER_TEMP/kt.err"; then
              if grep -qiE 'password was incorrect|tampered' "$RUNNER_TEMP/kt.out" "$RUNNER_TEMP/kt.err"; then
                echo "::error::ANDROID_KEYSTORE_PASSWORD does not match your key file. The secret has ${#KS_PASS} characters; the one made by make-upload-key has 24. Copy the value again from github-secrets.txt and replace the secret."
              else
                echo "::error::The key file could not be opened: $(head -c 200 "$RUNNER_TEMP/kt.err" | tr '\n' ' ')"
              fi
              exit 1
            fi
            if ! grep -qiE "^${KEY_ALIAS}," "$RUNNER_TEMP/kt.out"; then
              aliases="$(grep -E ', (PrivateKeyEntry|trustedCertEntry)' "$RUNNER_TEMP/kt.out" | cut -d, -f1 | tr '\n' ' ')"
              echo "::error::ANDROID_KEY_ALIAS is '${KEY_ALIAS}' but your key file contains: ${aliases:-nothing}. Replace the secret with that name."
              exit 1
            fi
            signing="your own key"
          else
            KS_PASS="$(openssl rand -hex 16)"; KEY_PASS="$KS_PASS"; KEY_ALIAS="temporary"
            echo "::add-mask::$KS_PASS"
            keytool -genkeypair -keystore "$ks" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" -dname "CN=InstaRide temporary test key" > /dev/null
            signing="a throwaway key (fine for installing on phones, NOT for Google Play)"
          fi
          export KS_PASS KEY_PASS
          case "${EXPO_PUBLIC_MAPS:-}" in
            mappls) map_note="Mappls map" ;;
            native) map_note="live Google map" ;;
            *) map_note="placeholder (no Mappls files, or not signed with your own key)" ;;
          esac

          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          [ -x "$apksigner" ] || { echo "::error::apksigner was not found on this machine"; exit 1; }
          mkdir -p dist
          if ! "$apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --min-sdk-version 24 --v4-signing-enabled false \
            --out dist/instaride.apk android/app/build/outputs/apk/release/app-release.apk 2> "$RUNNER_TEMP/apksigner.err"; then
            echo "::error::Signing the app failed: $(head -c 400 "$RUNNER_TEMP/apksigner.err" | tr '\n' ' ')"
            exit 1
          fi
          "$apksigner" verify --print-certs dist/instaride.apk > "$RUNNER_TEMP/certs.txt" || { echo "::error::The signed app did not verify."; exit 1; }
          fingerprint="$(grep -i 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | head -1 | sed 's/.*: *//' | tr 'a-f' 'A-F')"
          echo "App signing SHA-256: ${fingerprint}"

          if [ "$PLAY_BUNDLE" = "true" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab dist/instaride.aab
            jarsigner -keystore "$ks" -storepass:env KS_PASS -keypass:env KEY_PASS dist/instaride.aab "$KEY_ALIAS" > /dev/null
            jarsigner -verify dist/instaride.aab > /dev/null
          fi
          rm -f "$ks"

          if [ "${MAPPLS_ENABLED:-}" = "1" ]; then
            if unzip -l dist/instaride.apk | grep -qi 'mappls'; then
              echo "Check passed: the Mappls files are inside the app."
            else
              echo "::error::This build was meant to include Mappls, but the finished app does not contain the Mappls files."
              exit 1
            fi
          fi

          {
            echo "commit:        $GITHUB_SHA"
            echo "built:         $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version code:  $ANDROID_VERSION_CODE"
            echo "signed with:   $signing"
            echo "signing SHA-256: ${fingerprint}"
            echo "map:           ${map_note}"
            (cd dist && sha256sum ./* && stat -c '%s bytes  %n' ./*)
          } > dist/build-info.txt
          cat dist/build-info.txt

          {
            echo "## Android build finished"
            echo ""
            echo "Download **instaride-android** from the *Artifacts* box at the bottom of this page."
            echo ""
            echo "- Signed with: ${signing}"
            echo "- Signing SHA-256: \`${fingerprint}\` (must match the fingerprint registered with Mappls)"
            echo "- Map: ${map_note}"
            echo "- On your phone: open the downloaded \`instaride.apk\`, and allow \"install unknown apps\" if Android asks."
            if [ "$PLAY_BUNDLE" = "true" ]; then echo "- Upload \`instaride.aab\` to the Google Play Console."; fi
            echo "- If this repository is public, anyone with a GitHub account can download these files. They contain no secrets."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: instaride-android
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Keep the build log if something went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/gradle.log
          retention-days: 7
          if-no-files-found: ignore
