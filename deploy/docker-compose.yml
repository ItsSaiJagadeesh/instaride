# InstaRide on one server: the app, Redis (database), Caddy (https) and a daily backup.
# Only Caddy is reachable from the internet (ports 80 and 443). The app and Redis stay on a private network.
name: instaride

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      REDIS_URL: redis://redis:6379
      UPLOADS_DIR: /data/uploads
      BACKUP_DIR: /backups
      TRUST_PROXY: "1"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - app_data:/data
      - ./backups:/backups:ro
    networks: [internal]
    expose: ["5000"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [internal]

  backup:
    image: redis:7-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      REDIS_HOST: redis
      BACKUP_DIR: /backups
      DATA_DIR: /data
      KEEP_DAYS: "14"
      INTERVAL_HOURS: "24"
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
      - app_data:/data:ro
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]

volumes:
  app_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  internal:
